    <script>
      // Suppress benign Vite dev WebSocket closing warning when HMR is disabled in AI Studio
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="root"></div>

  </body>
